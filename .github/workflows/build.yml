name: Build Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download TShock 6.2.1
        run: |
          mkdir -p lib
          # Link chính thức mới nhất
          wget -O tshock.zip "https://github.com/Pryaxis/TShock/releases/download/v6.2.1/TShock-6.2.1-for-Terraria-1.4.5.8-linux-amd64-release.zip" || \
          wget -O tshock.zip "https://github.com/Pryaxis/TShock/releases/download/v6.2.1/TShock-v6.2.1-linux-amd64-release.zip" || \
          wget -O tshock.zip "https://github.com/Pryaxis/TShock/releases/download/v6.1.0/TShock-5.2.4-for-Terraria-1.4.4.9-linux-amd64-release.zip"
          
          echo "=== Nội dung zip ==="
          unzip -l tshock.zip | head -50
          
          unzip -o tshock.zip -d tshock_temp
          
          echo "=== Tìm DLL ==="
          find tshock_temp -name "*.dll" | head -30
          
          # Copy tất cả dll quan trọng
          find tshock_temp -name "TShockAPI.dll" -exec cp -v {} lib/ \;
          find tshock_temp -name "OTAPI*.dll" -exec cp -v {} lib/ \;
          find tshock_temp -name "TerrariaServer.dll" -exec cp -v {} lib/ \;
          find tshock_temp -name "TSAPI.dll" -exec cp -v {} lib/ \;
          
          echo "=== Nội dung thư mục lib ==="
          ls -la lib/

      - name: Restore & Build
        run: |
          dotnet restore
          dotnet build -c Release --verbosity detailed

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: EyeOfCthulhuMod
          path: bin/Release/net9.0/EyeOfCthulhuMod.dll
